name: Bug
description: Something broke or looks wrong (not a number mismatch; use Accuracy report for that).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't attach tradebooks or screenshots that show amounts or symbols.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "Android 15, Chrome 140"
